services:
  sipa_nginx:
    image: nginx:alpine
    container_name: sipa_nginx
    restart: unless-stopped
    ports:
      - "8003:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      sipa_app:
        condition: service_started
    networks:
      - sipa_web

  sipa_app:
    build:
      context: ./docker/app
    container_name: sipa_app
    restart: unless-stopped
    working_dir: /var/www/html
    user: "lomi:lomi"
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    expose:
      - "9000"
    ports:
      - "5173:5173"
    depends_on:
      sipa_db:
        condition: service_healthy
    networks:
      - sipa_web

  sipa_db:
    container_name: sipa_db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sipa}
      POSTGRES_USER: ${DB_USERNAME:-sipa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5434:5432"
    volumes:
      - sipa_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sipa} -d ${DB_DATABASE:-sipa}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sipa_web

  sipa_mailpit:
    image: axllent/mailpit
    container_name: sipa_mailpit
    restart: unless-stopped
    ports:
      - "8026:8025"
      - "1026:1025"
    networks:
      - sipa_web

volumes:
  sipa_db_data:

networks:
  sipa_web:
    driver: bridge
